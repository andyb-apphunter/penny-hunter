<style>
:root{--bg:#F6F3FB;--surface:#FFFFFF;--ink:#4B4459;--muted:#6F6882;--line:#ECE6F5;--accent:#DCCFF3;--accent-hover:#CDBBEE;--accent-ink:#4B4459;--deep:#8A6FCB;--soft:#F1ECF8;

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.two>div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;min-width:0}.acct td,.acct th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}.acct th{font-weight:400;color:var(--muted);font-size:13px}.acct td:first-child,.acct th:first-child{text-align:left}.acct .mark{font-weight:700}.acct .mark.ok{color:var(--good)}.acct .mark.no{color:var(--bad)}

select,input[type=text],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;max-width:100%}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 16px}.chip{padding:7px 12px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer}.chip[aria-pressed=true]{background:var(--accent);border-color:var(--deep);color:var(--ink);font-weight:600}

.tx td{padding:6px 7px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}.tx th{text-align:left;padding:6px 7px;color:var(--muted);font-weight:400;font-size:13px;border-bottom:1px solid var(--line)}.tx select,.tx input{font-size:13px;padding:4px 6px}.tx .d{max-width:290px;word-break:break-word}

.notice.ok{background:var(--good-bg);color:var(--good)}

.btn.sm{padding:4px 12px;font-size:13px}
.setup tr.off td{color:var(--muted)}
input[type=date],input[type=password],textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;max-width:100%}
.sync{font-size:12.5px;color:var(--muted)}.sync.bad{color:var(--bad)}
nav{flex-wrap:wrap}body[data-page=add] #addp{display:none}.cand{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:14px}.cand .chip{text-align:left}.entrow td{vertical-align:middle}.phone-only{display:none}.ptot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding:12px;background:var(--soft);border-radius:12px}.ptot div{display:flex;flex-direction:column}.ptot b{font:700 20px var(--num);font-variant-numeric:tabular-nums}.pbud{margin:0 0 12px}
@media (max-width:820px){.phone-only{display:block}.desk-only{display:none}.form{grid-template-columns:1fr;gap:4px}.form>label{padding-top:8px}header.top{gap:8px 12px;padding:10px 16px}.brand{margin-right:auto}#refresh{padding:5px 12px;font-size:13px}#addp{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;border-radius:28px;padding:13px 20px;box-shadow:0 4px 14px rgba(75,68,89,.25)}#sync{order:3;width:100%}nav{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}nav button{padding:9px 2px;font-size:12.5px;white-space:nowrap}main{padding:16px 16px calc(88px + env(safe-area-inset-bottom))}.hero{padding:20px}.block,.two>div{padding:18px}}
</style></head><body>
<header class="top"><div class="brand">Penny Hunter <span id="ver" class="muted small" style="font-weight:400"></span></div>
<nav aria-label="Main"><button data-p="dash">Dashboard</button><button data-p="update">Update</button><button data-p="tx">Transactions</button><button data-p="setup">Setup</button><button data-p="settings">Settings</button></nav>
<button class="btn" id="addp">+ Purchase</button>
<span id="sync" class="sync" aria-live="polite">Saved on this device</span><button class="btn quiet" id="refresh">Refresh</button></header>
<main id="m"></main>
<script>
/* ===================== Penny Hunter: data and calculations ===================== */
const VERSION = '0.8.3';
const PH = (() => {
  // ---------- dates (plain YYYY-MM-DD strings) ----------
  const p2 = n => String(n).padStart(2, '0');
  const ymd = (y, m, d) => `${y}-${p2(m)}-${p2(d)}`;
  const parts = s => s.split('-').map(Number);
  const toNum = s => { const [y, m, d] = parts(s); return Date.UTC(y, m - 1, d) / 864e5; };
  const fromNum = n => { const d = new Date(n * 864e5); return ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); };
  const addDays = (s, n) => fromNum(toNum(s) + n);
  const diffDays = (a, b) => toNum(a) - toNum(b);
  const daysIn = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  function addMonths(s, n) {
    let [y, m, d] = parts(s); m = m - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12 + 1;
    return ymd(y, m, Math.min(d, daysIn(y, m)));
  }
  function today() {
    const q = new URLSearchParams(location.search).get('today');
    if (q && /^\d{4}-\d\d-\d\d$/.test(q)) return q;
    const n = new Date(); return ymd(n.getFullYear(), n.getMonth() + 1, n.getDate());
  }
  const now = () => Date.now();
  const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;

  function occurrences(anchor, freq, start, end) {
    if (!anchor) return [];
    const out = [], f = String(freq || '').toLowerCase();
    if (f === 'weekly' || f === 'fortnightly') {
      const step = f === 'weekly' ? 7 : 14;
      let d = toNum(anchor); const s = toNum(start), e = toNum(end);
      while (d >= s) d -= step;
      d += step;
      for (; d < e; d += step) if (d >= s) out.push(fromNum(d));
      return out;
    }
    const months = { monthly: 1, quarterly: 3, annually: 12 }[f];
    if (!months) return (start <= anchor && anchor < end) ? [anchor] : [];
    let i = 0;
    while (addMonths(anchor, i * months) >= start) i--;
    i++;
    while (addMonths(anchor, i * months) < end) { out.push(addMonths(anchor, i * months)); i++; }
    return out;
  }

  // ---------- the stored data ----------
  // Every record carries u (last changed, ms) so two devices can merge; deleted records keep del=1.
  const COLS = ['accounts', 'income', 'routine', 'budgets', 'categories', 'tx', 'rules', 'balances', 'settings'];
  let DB = blank();
  function blank() { const d = {}; COLS.forEach(c => d[c] = {}); return d; }
  const uid = () => Math.random().toString(36).slice(2, 10) + now().toString(36);
  const live = col => Object.values(DB[col] || {}).filter(r => !r.del);
  function put(col, key, rec) { DB[col][key] = { ...(DB[col][key] || {}), ...rec, u: now() }; delete DB[col][key].del; changed(); return DB[col][key]; }
  function del(col, key) { if (DB[col][key]) { DB[col][key] = { ...DB[col][key], del: 1, u: now() }; changed(); } }
  const setting = (k, d = null) => { const r = DB.settings[k]; return r && !r.del ? r.value : d; };
  const setSetting = (k, v) => put('settings', k, { value: v });
  let onChange = () => {}, batching = 0, pendingChange = false;
  function changed() { if (batching) pendingChange = true; else onChange(); }
  function batch(fn) { batching++; try { return fn(); } finally { batching--; if (!batching && pendingChange) { pendingChange = false; onChange(); } } }

  function merge(remote) {
    // newest edit of each record wins; returns whether the remote copy is missing anything we have
    let localChanged = false, remoteBehind = false;
    for (const c of COLS) {
      const R = (remote && remote[c]) || {}, L = DB[c];
      for (const k in R) if (!L[k] || (R[k].u || 0) > (L[k].u || 0)) { L[k] = R[k]; localChanged = true; }
      for (const k in L) if (!R[k] || (L[k].u || 0) > (R[k].u || 0)) remoteBehind = true;
    }
    return { localChanged, remoteBehind };
  }

  // ---------- setup (what the Excel file used to hold) ----------
  const ord = (a, b) => (a.o ?? 0) - (b.o ?? 0) || String(a.name || a.category).localeCompare(String(b.name || b.category));
  const isYes = v => v === true || String(v).trim().toLowerCase() === 'yes';
  function setup() {
    const accounts = live('accounts').sort(ord).map(a => ({ ...a, available: isYes(a.available) }));
    const income = live('income').filter(i => isYes(i.active ?? true)).sort(ord);
    const routineAll = live('routine').sort(ord);
    const routine = routineAll.filter(p => isYes(p.active) && p.amount !== '' && p.amount != null && !isNaN(+p.amount)).map(p => ({ ...p, amount: +p.amount }));
    const budRows = live('budgets').sort(ord);
    const categories = budRows.map(b => b.category);
    const budgets = budRows.filter(b => b.amount !== '' && b.amount != null && !isNaN(+b.amount))
      .map(b => ({ category: b.category, fortnight: r2(+b.amount * (String(b.period).toLowerCase() === 'monthly' ? 12 / 26 : 1)) }));
    return { accounts, income: income.map(i => ({ ...i, amount: +i.amount || 0 })), routine, routineAll, budgets, categories };
  }
  function allCategories(S) {
    const out = [...S.categories], seen = new Set(out.map(x => x.toLowerCase()));
    live('categories').sort((a, b) => (a.added || '').localeCompare(b.added || '')).forEach(r => { if (!seen.has(r.name.toLowerCase())) { out.push(r.name); seen.add(r.name.toLowerCase()); } });
    return out;
  }
  function addCategory(S, name) {
    name = String(name || '').split(/\s+/).filter(Boolean).join(' ');
    if (!name) throw new Error('Enter a name for the category.');
    if (name.length > 40) throw new Error('Keep the category name to 40 characters or fewer.');
    for (const x of allCategories(S)) if (x.toLowerCase() === name.toLowerCase()) return x;
    put('categories', name.toLowerCase(), { name, added: new Date().toISOString() });
    return name;
  }

  // ---------- reading bank files ----------
  function parseCSVText(text) {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows;
  }
  function money(s) { s = String(s ?? '').trim().replace(/\$/g, '').replace(/,/g, '').replace(/\+/g, ''); return s ? parseFloat(s) : null; }
  function pdate(s) {
    const m = String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m || +m[2] < 1 || +m[2] > 12 || +m[1] < 1 || +m[1] > daysIn(+m[3], +m[2])) throw new Error(`Couldn't read the date '${String(s).trim()}'. Dates need to look like 05/11/2026.`);
    return ymd(+m[3], +m[2], +m[1]);
  }
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const rows = parseCSVText(text).filter(r => r.some(c => c.trim()));
    if (!rows.length) throw new Error('This file is empty.');
    const head = rows[0].map(c => c.trim().toLowerCase());
    let bank, out = [];
    if (head.slice(0, 5).join(',') === 'date,description,credit,debit,balance') {
      bank = 'ING';
      for (const r of rows.slice(1)) { const cr = money(r[2]), db = money(r[3]); out.push({ date: pdate(r[0]), amount: cr != null ? cr : db, description: (r[1] || '').trim(), balance: r.length > 4 ? money(r[4]) : null }); }
    } else if (rows[0].length >= 4 && /^\s*[+-]\$?[\d,]*\.?\d+\s*$/.test(rows[0][3] || '')) {
      bank = 'CommBank';
      for (const r of rows) out.push({ date: pdate(r[0]), amount: money(r[1]), description: r[2].trim(), balance: money(r[3]) });
    } else if (rows[0].length >= 3) {
      bank = 'ANZ';
      for (const r of rows) out.push({ date: pdate(r[0]), amount: money(r[1]), description: r.slice(2).join(',').trim(), balance: null });
    } else throw new Error("This doesn't look like an ANZ, ING or CommBank export.");
    if (out.some(x => x.amount == null || isNaN(x.amount))) throw new Error("Some rows have no amount, so this file wasn't imported.");
    return { bank, rows: out };
  }
  function guessAccount(filename, bank, S) {
    const n = filename.toLowerCase(), names = S.accounts.map(a => a.name);
    const find = re => names.find(x => re.test(x)) || null;
    if (bank === 'ING') return find(/\bING\b/i);
    if (bank === 'CommBank') return find(/commbank|commonwealth/i);
    if (n.includes('off')) return find(/offset/i);
    if (n.includes('loan')) return find(/loan/i);
    if (n.includes('credit') || n.includes('card')) return find(/credit|card/i);
    return null;
  }

  // ---------- recognising transactions ----------
  function merchantKey(desc) {
    let s = desc.toUpperCase();
    if (s.includes(' - ')) s = s.split(' - ')[0];
    s = s.replace(/VISA DEBIT (PURCHASE|DEPOSIT) CARD \d+|VISA DEBIT (PURCHASE|DEPOSIT)|EFTPOS|ANZ (MOBILE|INTERNET) BANKING PAYMENT \d+ TO|ANZ INTERNET BANKING BPAY|PAYMENT TO/g, ' ');
    s = s.replace(/\b(SQ|SP|SMP|ZLR|KPAY|TM|PIN)\s*\*/g, ' ');
    s = s.replace(/[^A-Z& ]+/g, ' ');
    return s.split(/\s+/).filter(Boolean).slice(0, 3).join(' ') || desc.toUpperCase().slice(0, 24);
  }
  // Generic bank wording only. Anything personal (names, payees) lives in your data, not in this public code.
  const TRANSFER = /FUNDS TFER|REDRAW TRANSFER|M-BANKING TRANSFER|PAYMENT THANKYOU|INTERNAL TRANSFER|SAVINGS MAXIMISER|^LOAN PAYMENT/i;
  const INCOME = /PAY\/SALARY/i;
  const LOAN_NOISE = /^INTEREST ADJUSTMENT|^RATE CHANGE/i;
  const SUGGEST = [
    [/COLES|WOOLWORTHS|ALDI|FOODWORKS|IGA |HARRIS FARM|COSTCO/i, 'Groceries'],
    [/PETSTOCK|GREENCROSS|PET CIRCLE|VETS\b|VETERINARY/i, 'Pets'],
    [/CAFE|COFFEE|STARBUCKS|UBER \*EATS|MCDONALD|PIZZA|KFC|SUSHI|GUZMAN|MAD MEX|RESTAURANT|BREW|BAKERS DELIGHT|JUICE|HUNGRY JACK|DOMINOS|MENULOG|DOORDASH/i, 'Eating out'],
    [/AMPOL|BP |SHELL|CALTEX|7-ELEVEN|LINKT|CAR WASH|PARKNPAY|PARKING|WILSON PARK|CARP\d/i, 'Car'],
    [/UBER \*TRIP|OPAL|TRANSPORTFORNSW|DIDI/i, 'Transport'],
    [/FLEXISCHOOLS|SCHOOL/i, 'Kids'],
    [/PHARMACY|CHEMIST|MEDICARE|PRICELINE/i, 'Health'],
    [/AUDIBLE|SPOTIFY|NETFLIX|DISNEY|HUBBL|PLAYSTATION|GOOGLE|APPLE\.COM|STAN\.COM|BINGE/i, 'Subscriptions'],
    [/KMART|BIG W|TARGET|REBEL|JB HI-FI|AMAZON|BUNNINGS|DECATHLON|DYMOCKS|MYER|DAVID JONES/i, 'Personal'],
  ];
  const hasText = (desc, text) => !!text && String(text).split('|').map(s => s.trim()).filter(Boolean).some(w => desc.toUpperCase().includes(w.toUpperCase()));
  const ownNames = () => String(setting('own_names', '') || '').split(/\n|;/).map(s => s.trim()).filter(Boolean);
  const routineMatch = p => p.match ? p.match : String(p.name || '').split(/\s+/)[0];
  function suggest(desc) {
    for (const [text, c] of setting('suggest', []) || []) if (hasText(desc, text)) return c;
    for (const [re, c] of SUGGEST) if (re.test(desc)) return c;
    return null;
  }

  function isTransfer(desc, account, S) {
    if (TRANSFER.test(desc)) return true;
    if (ownNames().some(n => hasText(desc, n))) return true;
    if (S.accounts.some(a => a.name !== account && a.name.length >= 6 && desc.toUpperCase().includes(a.name.toUpperCase()))) return true;
    return S.routineAll.some(p => String(p.type).toLowerCase() === 'transfer' && p.account === account && hasText(desc, routineMatch(p)));
  }
  function incomeFor(desc, account, S) {
    return S.income.find(i => i.account === account && i.match && hasText(desc, i.match)) || null;
  }
  function classify(row, account, S) {
    const d = row.description, a = row.amount;
    if (LOAN_NOISE.test(d)) return ['ignore', null, 1, 'Loan adjustment'];
    if (isTransfer(d, account, S)) return ['transfer', null, 1, 'Between accounts'];
    if (INCOME.test(d) || (a > 0 && incomeFor(d, account, S))) return ['income', null, 1, 'Pay or rent'];
    const r = DB.rules[merchantKey(d)];
    if (r && !r.del && r.always) return [r.kind, r.category, 1, 'Your saved answer'];
    if (r && !r.del) return [r.kind, r.category, 0, 'Your last answer'];
    return [a > 0 ? 'refund' : 'spend', suggest(d), 0, ''];
  }
  const txs = () => live('tx').sort((a, b) => a.date.localeCompare(b.date) || (a.n || 0) - (b.n || 0));

  function trackingStart(S) {
    let v = setting('tracking_start');
    if (v) return v;
    v = lastPayday(S); setSetting('tracking_start', v); return v;
  }
  function mainIncome(S) { return S.income.find(i => isYes(i.main)) || S.income[0] || null; }
  function nextPayday(S) {
    const i = mainIncome(S), t = today();
    if (!i || !i.next) return addDays(t, 14);
    return occurrences(i.next, i.freq, addDays(t, 1), addDays(t, 60))[0] || addDays(t, 14);
  }
  const lastPayday = S => addDays(nextPayday(S), -14);

  function importFile(S, name, text, account) {
    const { bank, rows } = parseCSV(text);
    account = account || guessAccount(name, bank, S);
    if (!account) throw new Error('Choose which account this file is for.');
    const start = trackingStart(S);
    let added = 0, dup = 0, old = 0; const seen = {};
    let seq = Object.values(DB.tx).reduce((m, t) => Math.max(m, t.n || 0), 0), bal = null, matched = 0; const newKeys = [];
    batch(() => {
      for (const r of rows) {
        const base = [account, r.date, r.amount.toFixed(2), r.description.toLowerCase().split(/\s+/).filter(Boolean).join(' ')].join('|');
        seen[base] = (seen[base] || 0) + 1;
        const key = base + '|' + seen[base];
        if (r.date < start) { old++; continue; }
        if (DB.tx[key] && !DB.tx[key].del) { dup++; continue; }
        const [kind, cat, rev, why] = classify(r, account, S);
        put('tx', key, { key, n: ++seq, account, date: r.date, amount: r.amount, description: r.description, kind, category: cat, note: '', reviewed: rev, auto_reason: why, merchant: merchantKey(r.description), imported_at: today() });
        added++; newKeys.push(key);
      }
      const wb = rows.filter(r => r.balance != null);
      if (wb.length) {
        let top = wb[0]; for (const r of wb) if (r.date > top.date) top = r;
        const cur = latestBalance(account, S);
        if (!cur || top.date >= cur.date) { addBalance(account, top.balance, top.date, 'file'); bal = top.balance; }
      }
      matched = matchEntries(newKeys);
      pairReversals(); applyRoutineMatches(S);
    });
    return { file: name, bank, account, new: added, duplicates: dup, older: old, balance: bal, matched };
  }

  function pairReversals() {
    const all = txs().filter(t => !t.manual);
    for (const r of all.filter(t => /^(reversal|return )/i.test(t.description))) {
      const lo = addDays(r.date, -3);
      const m = all.filter(t => t.account === r.account && t.date >= lo && t.date <= r.date && t.amount === -r.amount && t.kind !== 'ignore' && t.key !== r.key)
        .sort((a, b) => b.date.localeCompare(a.date))[0];
      if (m) for (const k of [r.key, m.key]) put('tx', k, { kind: 'ignore', reviewed: 1, auto_reason: 'Failed debit, reversed' });
    }
  }

  function matchRoutines(S, start, end) {
    const list = txs().filter(t => !t.manual && t.kind !== 'ignore' && t.amount < 0 && t.date >= start);
    const used = new Map(), occs = [];
    const sorted = [...S.routine].map((p, i) => [p, i]).sort((a, b) => a[0].amount - b[0].amount || a[1] - b[1]).map(x => x[0]);
    for (const p of sorted) {
      const pat = routineMatch(p);
      if (!p.next) { for (const t of list) if (!used.has(t.key) && t.account === p.account && hasText(t.description, pat)) used.set(t.key, p); continue; }
      const weekly = String(p.freq).toLowerCase() === 'weekly';
      for (const due of occurrences(p.next, p.freq, start, end)) {
        const lo = addDays(due, weekly ? -2 : -4), hi = addDays(due, weekly ? 4 : 7);
        let best = null;
        for (const t of list) {
          if (used.has(t.key) || t.account !== p.account) continue;
          if (t.date < lo || t.date > hi || !hasText(t.description, pat)) continue;
          const gap = Math.abs(Math.abs(t.amount) - p.amount);
          if (gap > Math.max(p.amount * 0.2, 1)) continue;
          const sc = [gap, Math.abs(diffDays(t.date, due))];
          if (!best || sc[0] < best[0][0] || (sc[0] === best[0][0] && sc[1] < best[0][1])) best = [sc, t];
        }
        if (best) used.set(best[1].key, p);
        occs.push({ p, due, tx: best ? best[1] : null });
      }
    }
    return { occs, used };
  }
  function applyRoutineMatches(S) {
    const { used } = matchRoutines(S, trackingStart(S), addDays(today(), 31));
    for (const [k, p] of used) {
      const t = DB.tx[k];
      if (t.auto_reason === 'Your edit' || /^Matched/.test(t.auto_reason || '') || t.manual) continue;
      if (String(p.type).toLowerCase() === 'transfer') put('tx', k, { kind: 'transfer', reviewed: 1, auto_reason: 'Routine: ' + p.name });
      else put('tx', k, { kind: 'spend', category: p.category, reviewed: 1, auto_reason: 'Routine: ' + p.name });
    }
  }

  function latestBalance(account, S) {
    const b = live('balances').filter(x => x.account === account).sort((a, b) => b.date.localeCompare(a.date) || (b.s || 0) - (a.s || 0))[0];
    return b ? { date: b.date, amount: +b.amount, source: b.source } : null;
  }
  let bseq = 0;
  function addBalance(account, amount, date, source) {
    const id = uid(); bseq = Math.max(bseq + 1, now());
    put('balances', id, { id, account, date: date || today(), amount: +amount, source, s: bseq });
  }

  // ---------- the main calculation ----------
  function dashboard() {
    const S = setup(), t = today(), pay = nextPayday(S), pstart = addDays(pay, -14), tstart = trackingStart(S);
    const availNames = S.accounts.filter(a => a.available).map(a => a.name);
    const balances = {}; S.accounts.forEach(a => balances[a.name] = latestBalance(a.name, S));
    const available = r2(availNames.reduce((s, n) => s + (balances[n] ? balances[n].amount : 0), 0));
    const missing = Object.keys(balances).filter(n => !balances[n]);
    const { occs, used } = matchRoutines(S, tstart < pstart ? tstart : pstart, pay);
    const lastImport = {}; txs().filter(x => !x.manual).forEach(x => { if (!lastImport[x.account] || x.date > lastImport[x.account]) lastImport[x.account] = x.date; });
    const upcoming = [], unseen = [];
    for (const o of occs) {
      const p = o.p;
      if (o.tx || !availNames.includes(p.account)) continue;
      if (String(p.type).toLowerCase() === 'transfer' && availNames.includes(p.to)) continue;
      const b = balances[p.account], asAt = b ? b.date : t;
      const item = { name: p.name, amount: p.amount, date: o.due, account: p.account, category: p.category || 'Transfer' };
      if (p.next && o.due < p.next) continue;
      if (o.due >= asAt) upcoming.push(item);
      else if (o.due >= tstart && lastImport[p.account] && lastImport[p.account] >= addDays(o.due, 3)) unseen.push(item);
    }
    upcoming.sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name));
    const bills = r2(upcoming.reduce((s, u) => s + u.amount, 0));

    const main = mainIncome(S);
    const wife = S.income.find(i => i !== main && /card/i.test(i.use || '')) || null;
    const card = S.accounts.find(a => /credit/i.test(a.type || ''));
    const rows = txs().filter(x => x.date >= pstart && x.date < pay);
    const wifeIn = wife ? rows.filter(r => r.kind === 'income' && hasText(r.description, wife.match)).reduce((s, r) => s + r.amount, 0) : 0;
    const cardPaid = card ? rows.filter(r => r.account === card.name && r.amount > 0 && r.kind === 'transfer').reduce((s, r) => s + r.amount, 0) : 0;
    const held = r2(Math.max(0, wifeIn - cardPaid)), excess = Math.max(0, cardPaid - wifeIn);
    const purchases = card ? rows.filter(r => r.account === card.name && (r.kind === 'spend' || r.kind === 'refund')).reduce((s, r) => s - r.amount, 0) : 0;
    const newCard = r2(Math.max(0, purchases - excess));

    let otherIncome = 0; const incomeRows = [];
    for (const i of S.income) {
      if (i === wife || i === main || !availNames.includes(i.account)) continue;
      for (const d of occurrences(i.next, i.freq, t, pay)) { otherIncome += i.amount; incomeRows.push({ name: i.name, amount: i.amount, date: d }); }
    }
    const spent = {};
    for (const r of rows) if ((r.kind === 'spend' || r.kind === 'refund') && r.category && !used.has(r.key)) spent[r.category] = (spent[r.category] || 0) - r.amount;
    let planned = 0; const budgets = [];
    for (const b of S.budgets) {
      const s = r2(spent[b.category] || 0), left = Math.max(0, b.fortnight - s);
      planned += left; budgets.push({ category: b.category, budget: b.fortnight, spent: s, left: r2(left) });
    }
    planned = r2(planned);
    const waiting = entries().filter(e => availNames.includes(e.account) && notInBalance(e));
    const pendingBy = {}; waiting.forEach(e => pendingBy[e.account] = (pendingBy[e.account] || 0) - e.amount);
    const pending = r2(waiting.reduce((s, e) => s - e.amount, 0));
    // Card purchases already count against the budgets they belong to, so they aren't taken off a second time.
    const left = r2(available + otherIncome - held - pending - bills - planned);

    const days = Math.max(diffDays(pay, t), 1), series = [];
    let bal = available + otherIncome - held - pending;
    for (let n = 0; n <= days; n++) {
      const d = addDays(t, n);
      if (d >= pay) { series.push({ date: d, balance: r2(left), items: [] }); break; }
      const items = upcoming.filter(u => u.date === d || (n === 0 && u.date < d));
      bal -= items.reduce((s, u) => s + u.amount, 0); bal -= planned / days;
      series.push({ date: d, balance: r2(bal), items });
    }
    const accountsCheck = accountCheck(S, balances, availNames, tstart, held, newCard, planned, main, pendingBy);
    const outlook = { quarter: outlookTo(S, availNames, pay, addMonths(t, 3), left), year: outlookTo(S, availNames, pay, addMonths(t, 12), left) };
    const warnings = [];
    for (const p of S.routine) if (!p.next) warnings.push(`${p.name} has no due date, so its $${p.amount.toFixed(2)} ${String(p.freq).toLowerCase()} isn't in the calculation. Add the date in Setup.`);
    for (const n of missing) warnings.push(`Enter a balance for ${n}.`);
    for (const n of [...availNames, ...(card ? [card.name] : [])]) { const b = balances[n]; if (b && diffDays(t, b.date) > 7) warnings.push(`The ${n} balance is from ${b.date}. Update it for a current figure.`); }
    if (!S.income.length) warnings.push('Add your pay in Setup so the app knows when payday is.');
    const toReview = live('tx').filter(x => !x.reviewed).length;
    const allEntries = entries().sort((a, b) => b.date.localeCompare(a.date)).map(e => {
      const last = lastImport[e.account];
      return { key: e.key, date: e.date, merchant: e.description, amount: -e.amount, account: e.account, category: e.category, by: e.by || '', note: e.note || '',
        stale: !!(last && last >= addDays(e.date, 7)) };
    });
    const stale = allEntries.filter(e => e.stale).length;
    if (stale) warnings.push(`${stale} of your entries haven't turned up in your bank files after a week. Check them under Your entries.`);
    const debtType = a => /loan|credit/i.test(a.type || '');
    const assets = S.accounts.filter(a => balances[a.name] && !debtType(a)).reduce((s, a) => s + balances[a.name].amount, 0);
    const debts = S.accounts.filter(a => balances[a.name] && debtType(a)).reduce((s, a) => s + balances[a.name].amount, 0);
    const position = { accounts: S.accounts.map(a => ({ name: a.name, type: /credit/i.test(a.type) ? 'Credit card' : /loan/i.test(a.type) ? 'Loan' : a.type, available: a.available, ...(balances[a.name] || { amount: null, date: null, source: null }) })), assets: r2(assets), debts: r2(debts), net: r2(assets - debts) };
    const wn = wife ? occurrences(wife.next, wife.freq, t, addDays(t, 15))[0] || null : null;
    return { version: VERSION, today: t, payday: pay, period_start: pstart, left, status: left >= 0 ? 'good' : 'short',
      sum: { available, other_income: r2(otherIncome), income_rows: incomeRows, held, new_card: newCard, pending, bills, planned, avail_names: availNames },
      entries: allEntries,
      wife: wife ? wife.name : null, wife_next: wn, wife_estimate: wife ? wife.amount : null, main_account: main ? main.account : null,
      upcoming, unseen, budgets, series, warnings, to_review: toReview, accounts_check: accountsCheck, loan_check: loanCheck(S, tstart), outlook,
      position, trend: trend(S, tstart), categories: allCategories(S), budget_total: r2(budgets.reduce((s, b) => s + b.budget, 0)) };
  }

  function accountCheck(S, balances, availNames, tstart, held, newCard, planned, main, pendingBy = {}) {
    const t = today(); const { occs } = matchRoutines(S, tstart, addDays(t, 75)); const out = [];
    for (const name of availNames) {
      const b = balances[name]; if (!b) continue;
      const arrivals = [];
      for (const o of occs) { const p = o.p; if (p.to === name && !o.tx && o.due >= t && (!p.next || o.due >= p.next)) arrivals.push([o.due, p.amount, p.name]); }
      if (main && main.account === name) arrivals.push([nextPayday(S), main.amount, main.name.replace(/'s salary/i, "'s pay")]);
      arrivals.sort((a, b) => a[0].localeCompare(b[0]));
      const nxt = arrivals[0] || null, limit = nxt ? nxt[0] : nextPayday(S);
      const due = [];
      for (const o of occs) { const p = o.p; if (p.account === name && !o.tx && o.due >= b.date && o.due < limit && (!p.next || o.due >= p.next)) due.push({ name: p.name, amount: p.amount, date: o.due }); }
      due.sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name));
      const isMain = main && main.account === name, hold = isMain ? held : 0, spend = r2(isMain ? planned : 0);
      const total = r2(due.reduce((s, d) => s + d.amount, 0));
      const pend = r2(pendingBy[name] || 0);
      out.push({ account: name, balance: b.amount, as_at: b.date, held: hold, due_total: total, due, pending: pend, left: r2(b.amount - hold - total - spend - pend),
        card: r2(isMain ? newCard : 0), planned: r2(isMain ? planned : 0), spend, next: nxt ? { date: nxt[0], amount: nxt[1], name: nxt[2] } : null });
    }
    return out;
  }

  // Looking further ahead: start from what's left at payday, then add each pay and take off each payment and each fortnight's budgets.
  function outlookTo(S, availNames, pay, end, left) {
    const card = new Set(S.accounts.filter(a => /credit/i.test(a.type || '')).map(a => a.name));
    const ev = [], inc = {}, out = {};
    const add = (g, k, name, amount, date, freq) => { const x = g[k] || (g[k] = { name, freq, amount: 0, times: 0, first: date }); x.amount = r2(x.amount + amount); x.times++; };
    for (const i of S.income) {
      if (!availNames.includes(i.account)) continue;
      for (const d of occurrences(i.next, i.freq, pay, end)) { ev.push({ date: d, amount: i.amount }); add(inc, i.id || i.name, i.name, i.amount, d, i.freq); }
    }
    for (const p of S.routine) {
      if (!availNames.includes(p.account)) continue;
      const tr = String(p.type).toLowerCase() === 'transfer';
      if (tr && (availNames.includes(p.to) || card.has(p.to))) continue;
      for (const d of occurrences(p.next, p.freq, pay, end)) { if (p.next && d < p.next) continue; ev.push({ date: d, amount: -p.amount }); add(out, p.id || p.name, p.name, p.amount, d, p.freq); }
    }
    const fortnight = r2(S.budgets.reduce((s, b) => s + b.fortnight, 0));
    let budgets = 0;
    for (let d = pay; d < end; d = addDays(d, 14)) { const part = Math.min(14, diffDays(end, d)) / 14, amt = r2(fortnight * part); budgets = r2(budgets + amt); ev.push({ date: d, amount: -amt, budget: 1 }); }
    ev.sort((a, b) => a.date.localeCompare(b.date) || (a.amount > 0 ? -1 : 1));
    let run = left, low = left, lowDate = pay;
    for (const e of ev) { run += e.amount; if (run < low - 0.004) { low = r2(run); lowDate = e.date; } }
    const income = r2(Object.values(inc).reduce((s, x) => s + x.amount, 0)), bills = r2(Object.values(out).reduce((s, x) => s + x.amount, 0));
    const regular = f => /^(weekly|fortnightly|monthly)$/i.test(f || '');
    const sortBig = o => Object.values(o).sort((a, b) => b.amount - a.amount);
    return { end, from: pay, left, income, bills, budgets, budget_fortnight: fortnight, result: r2(left + income - bills - budgets), low: r2(low), low_date: lowDate,
      income_rows: sortBig(inc), bill_rows: sortBig(out), lumpy: Object.values(out).filter(x => !regular(x.freq)).sort((a, b) => a.first.localeCompare(b.first)) };
  }

  // The home loan: what's available in it now, plus money due in before the repayment, less the repayment.
  const availKey = loan => loan + ' (available)';
  function loanCheck(S, tstart) {
    const t = today(), loan = (S.accounts.find(a => /loan/i.test(a.type || '')) || {}).name;
    if (!loan) return null;
    const rank = p => /repay/i.test(p.name) ? 0 : /interest/i.test(p.name) ? 1 : 2;
    const charges = S.routine.filter(p => p.account === loan && String(p.type).toLowerCase() === 'bill' && p.next).sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
    if (!charges.length) return null;
    const ch = charges[0];
    const isCharge = x => x.account === loan && !x.manual && x.amount < 0 && !/ADJUSTMENT|REDRAW/i.test(x.description) && (hasText(x.description, routineMatch(ch)) || /^(INTEREST|LOAN REPAYMENT|REPAYMENT)/i.test(x.description));
    const charged = txs().filter(isCharge), seen = charged.map(x => x.date);
    // The repayment: learned from the last few repayments in the loan file (not the interest-only lines), otherwise the Setup amount.
    const past = charged.filter(x => !/^INTEREST/i.test(x.description)).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
    const amount = past.length ? r2(-past.reduce((s, x) => s + x.amount, 0) / past.length) : ch.amount;
    const due = occurrences(ch.next, ch.freq, t, addDays(t, 400)).find(d => !seen.some(x => Math.abs(diffDays(x, d)) <= 2));
    if (!due) return null;
    const cur = latestBalance(availKey(loan));
    const from = cur ? (cur.date > t ? t : cur.date) : t;   // money in after this date isn't in the available figure yet
    const credits = txs().filter(x => x.account === loan && !x.manual && x.amount > 0 && x.kind !== 'ignore' && x.date > addDays(from, -5) && x.date <= due);
    const used = new Set(), items = [];
    const { occs } = matchRoutines(S, addDays(from, -7), addDays(due, 1));
    const sched = [];
    for (const i of S.income.filter(i => i.account === loan)) for (const d of occurrences(i.next, i.freq, addDays(from, 1), addDays(due, 1))) sched.push({ name: i.name, amount: i.amount, date: d, match: i.match });
    for (const p of S.routine.filter(p => p.to === loan)) for (const d of occurrences(p.next, p.freq, addDays(from, 1), addDays(due, 1))) sched.push({ name: p.name, amount: p.amount, date: d, routine: p });
    sched.sort((a, b) => a.date.localeCompare(b.date));
    for (const sc of sched) {
      const near = credits.filter(x => !used.has(x.key) && Math.abs(diffDays(x.date, sc.date)) <= 5 && Math.abs(x.amount - sc.amount) <= Math.max(sc.amount * 0.35, 1) && (!sc.match || hasText(x.description, sc.match)))
        .sort((x, y) => Math.abs(diffDays(x.date, sc.date)) - Math.abs(diffDays(y.date, sc.date)))[0];
      if (near) { used.add(near.key); if (near.date > from) items.push({ date: near.date, name: sc.name, amount: near.amount, status: 'received' }); continue; }
      const paid = sc.routine && occs.find(o => o.p.id === sc.routine.id && o.tx && Math.abs(diffDays(o.tx.date, sc.date)) <= 5);
      if (paid) { if (paid.tx.date > from || sc.date > from) items.push({ date: paid.tx.date, name: sc.name, amount: -paid.tx.amount, status: 'paid_from', from: sc.routine.account }); continue; }
      items.push({ date: sc.date, name: sc.name, amount: sc.amount, status: sc.date >= t ? 'expected' : 'not_seen' });
    }
    for (const x of credits) if (!used.has(x.key) && x.date > from) items.push({ date: x.date, name: 'Extra money in', amount: x.amount, status: 'received' });
    // Money taken out of the loan after the available figure was entered (redraws), so it's no longer there.
    for (const x of txs()) if (x.account === loan && !x.manual && x.amount < 0 && x.date > from && x.date <= due && !isCharge(x) && !/ADJUSTMENT/i.test(x.description) && x.kind !== 'ignore') items.push({ date: x.date, name: 'Taken out', amount: x.amount, status: 'out' });
    items.sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name));
    const moneyIn = r2(items.reduce((s, x) => s + x.amount, 0)), current = cur ? r2(cur.amount) : 0;
    const gap = r2(amount - current - moneyIn);
    return { account: loan, charge: ch.name, amount, amount_from: past.length ? past.length : 0, setup_amount: ch.amount, due, current, current_date: cur ? cur.date : null, avail_key: availKey(loan),
      items, money_in: moneyIn, needed: Math.max(0, gap), spare: Math.max(0, -gap) };
  }

  function trend(S, tstart) {
    const pay = nextPayday(S), loans = new Set(S.accounts.filter(a => /loan/i.test(a.type || '')).map(a => a.name));
    const buckets = []; let end = pay;
    for (let i = 0; i < 26; i++) { const st = addDays(end, -14); if (end <= tstart) break; buckets.unshift([st, end]); end = st; }
    const all = txs().filter(x => (x.kind === 'spend' || x.kind === 'refund') && !loans.has(x.account));
    return buckets.map(([st, en]) => {
      const cats = {};
      for (const x of all) if (x.date >= st && x.date < en) { const k = x.category || 'Not categorised'; cats[k] = (cats[k] || 0) - x.amount; }
      Object.keys(cats).forEach(k => cats[k] = r2(cats[k]));
      return { start: st, end: addDays(en, -1), cats };
    });
  }

  // ---------- purchases you enter yourself ----------
  // They count straight away, then are swapped for the bank's line when a CSV brings it in.
  const entries = () => live('tx').filter(t => t.manual);
  function addPurchase({ date, merchant, amount, account, category, note, by }) {
    merchant = String(merchant || '').trim(); amount = Math.abs(parseFloat(String(amount ?? '').replace(/[$,]/g, '')));
    if (!merchant) throw new Error('Enter where you bought it.');
    if (!amount || isNaN(amount)) throw new Error('Enter the amount, such as 23.50.');
    if (!/^\d{4}-\d\d-\d\d$/.test(date || '')) throw new Error('Choose the date.');
    if (!account) throw new Error('Choose what you paid with.');
    const key = 'm:' + uid(), n = Object.values(DB.tx).reduce((m, t) => Math.max(m, t.n || 0), 0) + 1;
    put('tx', key, { key, n, manual: 1, created: now(), by: by || '', account, date, amount: -r2(amount), description: merchant, merchant: merchantKey(merchant),
      kind: 'spend', category: category || null, note: note || '', reviewed: 1, auto_reason: 'Your entry' + (by ? ' (' + by + ')' : '') + ', waiting for the bank' });
    return key;
  }
  // Bank lines already imported that look like the purchase you're about to enter.
  function bankLookalikes(date, amount, account) {
    amount = -Math.abs(+amount);
    return live('tx').filter(t => !t.manual && t.account === account && Math.abs(t.amount - amount) < 0.005 && t.date >= addDays(date, -1) && t.date <= addDays(date, 7) && !/^Matched/.test(t.auto_reason || ''));
  }
  function linkEntry(bankKey, entryKey) {
    const b = DB.tx[bankKey], e = DB.tx[entryKey];
    if (!b || b.del || !e || e.del) throw new Error('That entry or bank line no longer exists.');
    batch(() => {
      put('tx', bankKey, { kind: 'spend', category: e.category || b.category || null, note: [e.description, e.note, e.by && 'entered by ' + e.by].filter(Boolean).join(', '),
        reviewed: 1, auto_reason: 'Matched your entry: ' + e.description });
      del('tx', entryKey);
    });
  }
  function matchEntries(keys) {
    let n = 0;
    for (const k of keys) {
      const b = DB.tx[k]; if (!b || b.amount >= 0 || b.kind === 'transfer' || b.kind === 'ignore' || b.kind === 'income') continue;
      const c = entries().filter(e => e.account === b.account && Math.abs(e.amount - b.amount) < 0.005 && b.date >= addDays(e.date, -1) && b.date <= addDays(e.date, 7))
        .sort((x, y) => Math.abs(diffDays(b.date, x.date)) - Math.abs(diffDays(b.date, y.date)))[0];
      if (c) { linkEntry(k, c.key); n++; }
    }
    return n;
  }
  // Possible entries for a bank line that didn't match exactly (a different amount, account or a few days out).
  function entryCandidates(bankKey) {
    const b = DB.tx[bankKey]; if (!b || b.amount >= 0) return [];
    return entries().filter(e => {
      const gap = Math.abs(Math.abs(e.amount) - Math.abs(b.amount));
      return b.date >= addDays(e.date, -3) && b.date <= addDays(e.date, 10) && (gap <= Math.max(5, Math.abs(e.amount) * 0.15) || (e.account === b.account && merchantKey(b.description).split(' ')[0] === e.merchant.split(' ')[0]));
    }).sort((x, y) => Math.abs(Math.abs(x.amount) - Math.abs(b.amount)) - Math.abs(Math.abs(y.amount) - Math.abs(b.amount))).slice(0, 4);
  }
  function balanceStamp(account) {
    const b = live('balances').filter(x => x.account === account).sort((a, b) => b.date.localeCompare(a.date) || (b.s || 0) - (a.s || 0))[0];
    return b ? b.s || 0 : 0;
  }
  // Entries made after an account's balance was last updated aren't in that balance yet.
  const notInBalance = e => (e.created || 0) > balanceStamp(e.account);

  // ---------- answering questions ----------
  function answer(key, kind, category, note, always) {
    const r = DB.tx[key]; if (!r || r.del) throw new Error('That transaction no longer exists.');
    if ((kind === 'spend' || kind === 'refund') && !category) throw new Error('Choose a category.');
    batch(() => {
      put('tx', key, { kind, category: (kind === 'spend' || kind === 'refund') ? category : null, note: note || '', reviewed: 1, auto_reason: 'Your edit' });
      put('rules', r.merchant, { merchant: r.merchant, kind, category: category || null, always: always ? 1 : 0 });
      for (const x of live('tx')) if (x.merchant === r.merchant && !x.reviewed)
        put('tx', x.key, always ? { kind, category, reviewed: 1, auto_reason: 'Your saved answer' } : { kind, category });
    });
  }
  function acceptSuggested() {
    let n = 0;
    batch(() => { for (const x of live('tx')) if (!x.reviewed && (((x.kind === 'spend' || x.kind === 'refund') && x.category) || ['income', 'transfer', 'ignore'].includes(x.kind))) { put('tx', x.key, { reviewed: 1 }); n++; } });
    return n;
  }

  return { get DB() { return DB; }, set DB(v) { DB = v; }, blank, COLS, merge, live, put, del, uid, setting, setSetting, batch, setup, allCategories, addCategory,
    parseCSV, importFile, addPurchase, bankLookalikes, linkEntry, entryCandidates, entries, latestBalance, addBalance, dashboard, trackingStart, answer, acceptSuggested, txs, today, addDays, occurrences, routineMatch,
    set onChange(f) { onChange = f; } };
})();

/* ===================== Saving, sync and local "api" ===================== */
const STORE = (() => {
  let dbp;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => { const r = indexedDB.open('penny-hunter', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    return dbp;
  }
  async function get(k) { const d = await open(); return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
  async function set(k, v) { const d = await open(); return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
  return { get, set };
})();

const CRYPT = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const keys = {};
  async function key(pass, salt) {
    const id = salt + '|' + pass;
    if (!keys[id]) {
      const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
      keys[id] = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(salt), iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }
    return keys[id];
  }
  async function pipe(bytes, stream) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
  async function seal(obj, pass, salt) {
    salt = salt || b64(crypto.getRandomValues(new Uint8Array(16)));
    let bytes = enc.encode(JSON.stringify(obj)), gz = 0;
    if (typeof CompressionStream !== 'undefined') { bytes = await pipe(bytes, new CompressionStream('gzip')); gz = 1; }
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await key(pass, salt), bytes));
    return { app: 'penny-hunter', v: 1, salt, iv: b64(iv), gz, data: b64(ct) };
  }
  async function open(env, pass) {
    if (!env || env.app !== 'penny-hunter') throw new Error("This isn't Penny Hunter data.");
    let bytes;
    try { bytes = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, await key(pass, env.salt), unb64(env.data))); }
    catch { throw new Error("The passphrase doesn't match this data. Check it and try again."); }
    if (env.gz) bytes = await pipe(bytes, new DecompressionStream('gzip'));
    return JSON.parse(dec.decode(bytes));
  }
  return { seal, open, b64, unb64 };
})();

const SYNC = (() => {
  const FILE = 'penny-hunter.json';
  let cfg = {}, busy = null, again = false, dirty = false, timer = null, status = { text: 'Saved on this device', bad: false };
  const listeners = [];
  const setStatus = (text, bad = false) => { status = { text, bad }; listeners.forEach(f => f(status)); };
  async function load() { cfg = (await STORE.get('cfg')) || {}; return cfg; }
  async function saveCfg(c) { cfg = { ...cfg, ...c }; await STORE.set('cfg', cfg); }
  const ready = () => !!(cfg.token && cfg.gist && cfg.pass);
  async function gh(path, opts = {}) {
    let r;
    try { r = await fetch('https://api.github.com' + path, { ...opts, headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + cfg.token, 'Content-Type': 'application/json' } }); }
    catch { throw new Error("Couldn't reach GitHub. Check your internet connection."); }
    if (r.status === 401) throw new Error('GitHub rejected the key. Check it has the gist permission and hasn\'t expired.');
    if (r.status === 404) throw new Error("GitHub can't find the shared data. Check the setup link.");
    if (!r.ok) throw new Error('GitHub returned an error (' + r.status + '). Try again shortly.');
    return r.json();
  }
  async function pull() {
    const g = await gh('/gists/' + cfg.gist), f = g.files && g.files[FILE];
    if (!f) throw new Error("The shared data file is missing from the gist.");
    let text = f.content;
    if (f.truncated) { const r = await fetch(f.raw_url); text = await r.text(); }
    const env = JSON.parse(text);
    if (!cfg.salt) await saveCfg({ salt: env.salt });
    return CRYPT.open(env, cfg.pass);
  }
  async function push() {
    const env = await CRYPT.seal(PH.DB, cfg.pass, cfg.salt);
    await gh('/gists/' + cfg.gist, { method: 'PATCH', body: JSON.stringify({ files: { [FILE]: { content: JSON.stringify(env) } } }) });
  }
  async function create(token, pass) {
    cfg = { token, pass }; const env = await CRYPT.seal(PH.DB, pass);
    const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'Penny Hunter data (encrypted)', public: false, files: { [FILE]: { content: JSON.stringify(env) } } }) });
    await saveCfg({ token, pass, gist: g.id, salt: env.salt }); setStatus('Synced ' + timeNow());
  }
  async function unlock(pass) {
    const prev = cfg.pass; cfg.pass = pass;
    try { const remote = await pull(); await saveCfg({ pass }); PH.merge(remote); await APP.saveLocal(); dirty = true; await run(); }
    catch (e) { cfg.pass = prev; throw e; }
  }
  const timeNow = () => new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
  async function run() {
    if (!ready()) return { localChanged: false };
    if (busy) { again = true; return busy; }
    busy = (async () => {
      setStatus('Syncing…');
      try {
        const remote = await pull(), r = PH.merge(remote);
        if (r.localChanged) await APP.saveLocal();
        if (r.remoteBehind || dirty) { dirty = false; await push(); }
        setStatus('Synced ' + timeNow());
        if (r.localChanged) APP.remoteChanged();
        return r;
      } catch (e) { setStatus(e.message, true); throw e; }
    })();
    try { return await busy; } catch (e) { return { error: e }; } finally { busy = null; if (again) { again = false; run(); } }
  }
  function changed() { dirty = true; if (!ready()) return; clearTimeout(timer); timer = setTimeout(run, 1500); }
  function link() { return location.origin + location.pathname + '#join=' + btoa(JSON.stringify({ t: cfg.token, g: cfg.gist })).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  async function takeLink() {
    const m = location.hash.match(/join=([\w-]+)/); if (!m) return false;
    history.replaceState(null, '', location.pathname + location.search);
    try { const j = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))); if (j.t && j.g) { await saveCfg({ token: j.t, gist: j.g, pass: '', salt: '' }); return true; } } catch {}
    return false;
  }
  async function disconnect() { cfg = {}; await STORE.set('cfg', {}); setStatus('Saved on this device'); }
  setInterval(() => { if (ready() && document.visibilityState === 'visible') run(); }, 90000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ready()) run(); });
  return { load, ready, run, create, unlock, changed, link, takeLink, disconnect, get cfg() { return cfg; }, get status() { return status; }, onStatus: f => listeners.push(f) };
})();

const APP = (() => {
  let saveTimer = null, onRemote = () => {};
  async function saveLocal() { await STORE.set('db', PH.DB); }
  PH.onChange = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveLocal().catch(() => {}), 250); SYNC.changed(); };
  async function start() {
    const d = await STORE.get('db').catch(() => null);
    if (d) { const b = PH.blank(); PH.COLS.forEach(c => b[c] = d[c] || {}); PH.DB = b; }
    await SYNC.load();
    return SYNC.takeLink();
  }
  return { start, saveLocal, remoteChanged: () => onRemote(), set onRemote(f) { onRemote = f; } };
})();

/* The screens were first written against a small local server; this answers the same requests in the browser. */
async function api(u, b) {
  const url = new URL(u, location.href), p = url.pathname.replace(/^.*\/api\//, '/api/');
  const S = PH.setup();
  const out = (() => {
    switch (p) {
      case '/api/dashboard': return PH.dashboard();
      case '/api/review': return { items: PH.txs().filter(t => !t.reviewed).map(t => ({ ...t, id: t.key })), categories: PH.allCategories(S) };
      case '/api/transactions': {
        const q = (url.searchParams.get('q') || '').toLowerCase(), acc = url.searchParams.get('account') || '';
        const items = PH.txs().filter(t => (!acc || t.account === acc) && (!q || [t.description, t.category, t.note].some(x => String(x || '').toLowerCase().includes(q))))
          .reverse().slice(0, 500).map(t => ({ ...t, id: t.key }));
        return { items, categories: PH.allCategories(S), accounts: S.accounts.map(a => a.name) };
      }
      case '/api/accounts': {
        const list = [];
        for (const a of S.accounts) {
          const loan = /loan/i.test(a.type || '');
          list.push({ name: a.name, label: loan ? a.name + ': owing' : a.name, balance: PH.latestBalance(a.name, S) });
          if (loan) list.push({ name: a.name + ' (available)', label: a.name + ': available to redraw', extra: true, balance: PH.latestBalance(a.name + ' (available)', S) });
        }
        return { accounts: list, tracking_start: PH.trackingStart(S) };
      }
      case '/api/import': return { results: b.files.map(f => { try { return PH.importFile(PH.setup(), f.name, f.text, f.account); } catch (e) { return { file: f.name, error: e.message }; } }) };
      case '/api/balances': PH.batch(() => { for (const [k, v] of Object.entries(b.balances)) if (v !== '' && v != null) PH.addBalance(k, parseFloat(String(v).replace(/[$,]/g, '')), PH.today(), 'entered'); }); return { ok: true };
      case '/api/answer': PH.answer(b.id, b.kind, b.category, b.note, !!b.always); return { ok: true };
      case '/api/accept': return { accepted: PH.acceptSuggested() };
      case '/api/category': return { name: PH.addCategory(S, b.name) };
      case '/api/purchase': return { key: PH.addPurchase(b) };
      case '/api/delete-entry': { const t = PH.DB.tx[b.key]; if (t && t.manual) PH.del('tx', b.key); return { ok: true }; }
      case '/api/link': PH.linkEntry(b.bank, b.entry); return { ok: true };
      default: throw new Error('Not found');
    }
  })();
  return JSON.parse(JSON.stringify(out));
}

/* ===================== Setup and Settings screens ===================== */
const FREQS = ['Weekly', 'Fortnightly', 'Monthly', 'Quarterly', 'Annually', 'Once'];
const ACCOUNT_TYPES = ['Offset', 'Transaction', 'Savings', 'Loan', 'Credit card'];
const MATCH_HELP = 'Words from the bank description, e.g. ORIGIN ENERGY. Separate alternatives with |.';
function schema(tab) {
  const S = PH.setup(), accts = S.accounts.map(a => a.name), cats = PH.allCategories(S);
  return {
    accounts: { col: 'accounts', title: 'Accounts', label: 'account', fields: [
      ['name', 'Name', 'text', null, 'Must match how you refer to it, e.g. ANZ Offset.'], ['type', 'Type', 'select', ACCOUNT_TYPES],
      ['available', 'Counts as available money', 'select', ['Yes', 'No']]],
      cols: [['name', 'Account'], ['type', 'Type'], ['available', 'Available money']] },
    income: { col: 'income', title: 'Income', label: 'income', fields: [
      ['name', 'Name', 'text'], ['amount', 'Amount ($)', 'num'], ['freq', 'How often', 'select', FREQS], ['next', 'Next date', 'date'],
      ['account', 'Paid into', 'select', accts], ['use', 'Planned use', 'text', null, 'Include the word "card" if this pay goes to the credit card.'],
      ['match', 'Bank description words', 'text', null, MATCH_HELP], ['main', 'This pay sets payday', 'check'], ['active', 'Active', 'select', ['Yes', 'No']]],
      cols: [['name', 'Income'], ['amount', 'Amount', 'money'], ['freq', 'How often'], ['next', 'Next', 'date'], ['account', 'Paid into']] },
    routine: { col: 'routine', title: 'Payments', label: 'payment', fields: [
      ['name', 'Name', 'text'], ['amount', 'Amount ($)', 'num'], ['freq', 'How often', 'select', FREQS], ['next', 'Next due date', 'date'],
      ['account', 'From account', 'select', accts], ['type', 'Type', 'select', ['Bill', 'Transfer']], ['to', 'To account (transfers only)', 'select', ['', ...accts]],
      ['category', 'Category', 'select', ['', ...cats]], ['active', 'Active', 'select', ['Yes', 'No']], ['check', 'Needs checking', 'select', ['No', 'Yes']],
      ['match', 'Bank description words', 'text', null, MATCH_HELP + ' Leave empty to use the first word of the name.'], ['notes', 'Notes', 'text']],
      cols: [['name', 'Payment'], ['amount', 'Amount', 'money'], ['freq', 'How often'], ['next', 'Next due', 'date'], ['account', 'From']] },
    budgets: { col: 'budgets', title: 'Budgets', label: 'category', fields: [
      ['category', 'Category', 'text'], ['amount', 'Budget amount ($)', 'num', null, 'Leave empty for a category with no budget.'], ['period', 'Budget period', 'select', ['Fortnightly', 'Monthly']], ['notes', 'Notes', 'text']],
      cols: [['category', 'Category'], ['amount', 'Budget', 'money'], ['period', 'Period']] },
  }[tab];
}
const SETUP_TABS = [['accounts', 'Accounts'], ['income', 'Income'], ['routine', 'Payments'], ['budgets', 'Budgets'], ['matching', 'Matching']];
function setupPage() {
  const tab = state.stab || 'routine';
  const head = `<h2 style="margin-bottom:4px">Setup</h2><p class="muted small" style="margin-bottom:12px">Your accounts, pay, regular payments and budgets. Changes save straight away and sync to your other devices.</p><div class="chips" role="tablist">${SETUP_TABS.map(([k, l]) => `<button class="chip" role="tab" data-t="${k}" aria-pressed="${k === tab}">${l}</button>`).join('')}</div>`;
  if (tab === 'matching') return matchingTab(head);
  if (state.edit) return editForm(head, tab);
  const sc = schema(tab), q = (state.sq || '').toLowerCase();
  const rows = PH.live(sc.col).sort((a, b) => (a.o ?? 0) - (b.o ?? 0) || String(a.name || a.category).localeCompare(String(b.name || b.category)))
    .filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
  const cell = (r, [k, , t]) => { const v = r[k]; if (v === '' || v == null) return '<span class="muted">-</span>'; if (t === 'money') return fmt(+v); if (t === 'date') return dt(v, { day: 'numeric', month: 'short', year: 'numeric' }); return esc(v); };
  const extra = tab === 'budgets' ? PH.live('categories').filter(c => !rows.some(r => String(r.category).toLowerCase() === c.name.toLowerCase())) : [];
  m.innerHTML = head + `<div class="panel"><div class="toolbar"><input type="search" id="sq" placeholder="Search ${sc.title.toLowerCase()}" value="${esc(state.sq || '')}" style="flex:1;min-width:180px" aria-label="Search">${tab === 'routine' ? '<button class="btn quiet" id="addf">Add a one-off payment</button>' : ''}<button class="btn" id="add">Add ${sc.label}</button></div>
  ${rows.length ? `<div class="wrap"><table class="datatable setup"><tr>${sc.cols.map(c => `<th class="${c[2] === 'money' ? 'num' : ''}">${c[1]}</th>`).join('')}<th></th></tr>${rows.map(r => `<tr class="${r.active === 'No' ? 'off' : ''}">${sc.cols.map(c => `<td class="${c[2] === 'money' ? 'num' : ''}">${cell(r, c)}${c[0] === 'name' && r.active === 'No' ? ' <span class="muted small">(inactive)</span>' : ''}${c[0] === 'name' && r.check === 'Yes' ? ' <span class="small" style="color:var(--warn)">Check</span>' : ''}</td>`).join('')}<td style="text-align:right"><button class="btn quiet sm" data-e="${esc(r.id)}">Edit</button></td></tr>`).join('')}</table></div>` : `<p class="muted">Nothing here yet. Choose Add ${sc.label}, or bring in your setup file from Settings.</p>`}
  ${extra.length ? `<h3 style="margin-top:18px">Categories added while answering questions</h3><p class="muted small">These have no budget. Add one to track them here.</p><div class="chips">${extra.map(c => `<button class="chip" data-nb="${esc(c.name)}">+ Budget for ${esc(c.name)}</button>`).join('')}</div>` : ''}</div>`;
  bindTabs();
  let tm; $('#sq').oninput = e => { state.sq = e.target.value; clearTimeout(tm); tm = setTimeout(() => { setupPage(); const i = $('#sq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 300); };
  $('#add').onclick = () => { state.edit = 'new'; setupPage(); };
  if ($('#addf')) $('#addf').onclick = () => { state.edit = 'new'; state.prefill = { freq: 'Once', check: 'No' }; setupPage(); };
  m.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { state.edit = b.dataset.e; setupPage(); });
  m.querySelectorAll('[data-nb]').forEach(b => b.onclick = () => { state.edit = 'new'; state.prefill = { category: b.dataset.nb }; setupPage(); });
}
function bindTabs() { m.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { state.stab = b.dataset.t; state.edit = null; state.sq = ''; setupPage(); }); }
function editForm(head, tab) {
  const sc = schema(tab), isNew = state.edit === 'new', rec = isNew ? { active: 'Yes', available: 'Yes', type: tab === 'routine' ? 'Bill' : 'Transaction', freq: 'Fortnightly', period: 'Fortnightly', check: 'No', ...(state.prefill || {}) } : PH.DB[sc.col][state.edit];
  if (!rec) { state.edit = null; return setupPage(); }
  const field = ([k, label, type, opts, help]) => {
    const v = rec[k] ?? '', id = 'f_' + k;
    let input;
    if (type === 'select') input = `<select id="${id}">${(opts.includes(v) || v === '' ? opts : [v, ...opts]).map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o || 'None')}</option>`).join('')}</select>`;
    else if (type === 'check') input = `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="${id}" ${isYes(v) ? 'checked' : ''}> Yes</label>`;
    else input = `<input type="${type === 'date' ? 'date' : 'text'}" ${type === 'num' ? 'inputmode="decimal"' : ''} id="${id}" value="${esc(v)}" style="width:100%">`;
    return `<label for="${id}">${label}</label><div>${input}${help ? `<p class="muted small" style="margin-top:3px">${esc(help)}</p>` : ''}</div>`;
  };
  m.innerHTML = head + `<div class="panel" style="max-width:720px"><h3 style="margin-bottom:12px">${isNew ? (rec.freq === 'Once' ? 'Add a one-off payment' : 'Add ' + sc.label) : 'Edit ' + esc(rec.name || rec.category)}</h3>${isNew && rec.freq === 'Once' ? '<p class="muted small" style="margin:-6px 0 12px">Something due once, like car rego in six weeks. Set How often to Once and the due date. It comes off on that date and shows in the 3 and 12 month views.</p>' : ''}<div class="form">${sc.fields.map(field).join('')}</div><p class="err" id="er" hidden></p>
  <div class="actions"><button class="btn" id="sv">${isNew ? 'Add ' + sc.label : 'Save changes'}</button><button class="btn quiet" id="cx">Cancel</button>${isNew ? '' : `<span style="flex:1"></span><button class="btn quiet" id="dl">Delete</button>`}</div></div>`;
  bindTabs();
  const done = () => { state.edit = null; state.prefill = null; setupPage(); };
  $('#cx').onclick = done;
  $('#sv').onclick = () => {
    const er = $('#er'); er.hidden = true;
    try {
      const v = {};
      for (const [k, label, type] of sc.fields) {
        const el = $('#f_' + k);
        let x = type === 'check' ? (el.checked ? 'Yes' : 'No') : el.value.trim();
        if (type === 'num' && x !== '') { x = parseFloat(x.replace(/[$,]/g, '')); if (isNaN(x)) throw new Error(label + ' needs to be a number.'); }
        v[k] = x;
      }
      const nameKey = tab === 'budgets' ? 'category' : 'name';
      if (!v[nameKey]) throw new Error('Enter a ' + (tab === 'budgets' ? 'category' : 'name') + '.');
      const clash = PH.live(sc.col).find(r => r.id !== rec.id && String(r[nameKey]).toLowerCase() === v[nameKey].toLowerCase());
      if (clash && tab !== 'routine') throw new Error('There is already one called ' + v[nameKey] + '.');
      PH.batch(() => {
        if (!isNew && tab === 'accounts' && rec.name !== v.name) renameAccount(rec.name, v.name);
        if (!isNew && tab === 'budgets' && rec.category !== v.category) renameCategory(rec.category, v.category);
        if (tab === 'income' && v.main === 'Yes') PH.live('income').forEach(i => { if (i.id !== rec.id && isYes(i.main)) PH.put('income', i.id, { main: 'No' }); });
        const id = isNew ? PH.uid() : rec.id;
        PH.put(sc.col, id, { ...v, id, o: isNew ? PH.live(sc.col).length + 100 : rec.o });
      });
      done();
    } catch (e) { er.textContent = e.message; er.hidden = false; }
  };
  const dl = $('#dl');
  if (dl) dl.onclick = () => {
    if (dl.dataset.sure) { PH.del(sc.col, rec.id); done(); return; }
    dl.dataset.sure = 1; dl.textContent = 'Confirm delete'; dl.style.color = 'var(--bad)';
  };
}
function renameAccount(from, to) {
  for (const t of PH.live('tx')) if (t.account === from) PH.put('tx', t.key, { account: to });
  for (const b of PH.live('balances')) if (b.account === from) PH.put('balances', b.id, { account: to });
  for (const r of PH.live('routine')) { if (r.account === from) PH.put('routine', r.id, { account: to }); if (r.to === from) PH.put('routine', r.id, { to }); }
  for (const i of PH.live('income')) if (i.account === from) PH.put('income', i.id, { account: to });
}
function renameCategory(from, to) {
  for (const t of PH.live('tx')) if (t.category === from) PH.put('tx', t.key, { category: to });
  for (const r of PH.live('routine')) if (r.category === from) PH.put('routine', r.id, { category: to });
  for (const r of PH.live('rules')) if (r.category === from) PH.put('rules', r.merchant, { category: to });
}
const isYes = v => v === true || String(v).trim().toLowerCase() === 'yes';
function matchingTab(head) {
  const S = PH.setup();
  m.innerHTML = head + `<div class="panel" style="max-width:720px"><h3>Your names on statements</h3><p class="muted small" style="margin:4px 0 8px">Transactions containing any of these are treated as moving money between your own accounts. One per line, e.g. how your name appears on transfers.</p>
  <textarea id="own" rows="5" style="width:100%">${esc(PH.setting('own_names', ''))}</textarea>
  <h3 style="margin-top:18px">Tracking start date</h3><p class="muted small" style="margin:4px 0 8px">Bank file rows before this date are skipped.</p><input type="date" id="ts" value="${esc(PH.trackingStart(S))}">
  <p class="err" id="er" hidden></p><div class="actions"><button class="btn" id="sv">Save</button><span class="saved" id="ok" hidden>Saved</span></div></div>`;
  bindTabs();
  $('#sv').onclick = () => {
    const ts = $('#ts').value; if (!/^\d{4}-\d\d-\d\d$/.test(ts)) { $('#er').textContent = 'Choose a start date.'; $('#er').hidden = false; return; }
    PH.batch(() => { PH.setSetting('own_names', $('#own').value.trim()); PH.setSetting('tracking_start', ts); });
    $('#er').hidden = true; $('#ok').hidden = false;
  };
}

function settingsPage(msg) {

  ${empty ? `<div class="notice"><span>Welcome to Penny Hunter. Start by bringing in your data below, or join your shared data with a setup link.</span></div>` : ''}

  ${connected ? `<p style="margin:6px 0">✓ Connected. <span class="muted">${esc(SYNC.status.text)}</span></p><p class="muted small">Your data is encrypted with your passphrase before it leaves this device. GitHub only stores the scrambled copy.</p>

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Couldn't load a helper from the internet. Check your connection.")); document.head.appendChild(s); }); }
const LIB = { xlsx: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', sql: 'https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/' };
async function bringIn(files) {
  const rank = f => /\.xlsx$/i.test(f.name) ? 0 : /\.json$/i.test(f.name) ? 1 : 2;
  const out = [];
  for (const f of files.sort((a, b) => rank(a) - rank(b))) {
    try {
      if (/\.xlsx$/i.test(f.name)) out.push([f.name, await importSetupFile(await f.arrayBuffer())]);
      else if (/\.json$/i.test(f.name)) out.push([f.name, importJSON(JSON.parse(await f.text()))]);
      else out.push([f.name, await importOldDB(new Uint8Array(await f.arrayBuffer()))]);
    } catch (e) { out.push([f.name, '! ' + e.message]); }
  }
  return `<table class="datatable">${out.map(([n, r]) => `<tr><td><b style="font-weight:600">${esc(n)}</b></td><td style="${r.startsWith('!') ? 'color:var(--bad)' : ''}">${esc(r)}</td></tr>`).join('')}</table>`;
}
async function importSetupFile(buf) {
  if (!window.XLSX) await loadScript(LIB.xlsx);
  const wb = XLSX.read(buf, { type: 'array' });
  const rows = n => { const ws = wb.Sheets[n]; if (!ws) throw new Error(`The setup file has no ${n} sheet.`); return XLSX.utils.sheet_to_json(ws, { defval: '', raw: true }); };
  const day = v => { if (v === '' || v == null) return ''; if (typeof v === 'number') { const c = XLSX.SSF.parse_date_code(v); return `${c.y}-${String(c.m).padStart(2, '0')}-${String(c.d).padStart(2, '0')}`; } const m = String(v).match(/(\d{4})-(\d\d)-(\d\d)/); return m ? m[0] : ''; };
  const num = v => v === '' || v == null || isNaN(+v) ? '' : +v, txt = v => String(v ?? '').trim();
  const yes = v => txt(v).toLowerCase() === 'yes' ? 'Yes' : 'No';
  const n = { accounts: 0, income: 0, routine: 0, budgets: 0 };
  PH.batch(() => {
    const upsert = (col, keyField, rec, i) => { const ex = PH.live(col).find(r => String(r[keyField]).toLowerCase() === String(rec[keyField]).toLowerCase() && (col !== 'routine' || r.account === rec.account)); const id = ex ? ex.id : PH.uid(); PH.put(col, id, { ...rec, id, o: i }); n[col]++; };
    rows('Accounts').forEach((r, i) => {
      const name = txt(r['Account']); if (!name) return;
      upsert('accounts', 'name', { name, type: txt(r['Type']), available: yes(r['Counts as available money']) }, i);
      const bal = num(r['Current balance ($)']), d = day(r['Balance as at']);
      if (bal !== '' && !PH.latestBalance(name)) PH.addBalance(name, bal, d || PH.today(), 'setup');
    });
    let first = !PH.live('income').some(i => isYes(i.main));
    rows('Income').forEach((r, i) => {
      const name = txt(r['Income']); if (!name) return;
      const ex = PH.live('income').find(x => x.name.toLowerCase() === name.toLowerCase());
      upsert('income', 'name', { name, amount: num(r['Amount ($)']), freq: txt(r['Frequency']), next: day(r['Next pay date']), account: txt(r['Paid into']), use: txt(r['Planned use']), active: yes(r['Active']), main: ex ? ex.main || 'No' : (first ? 'Yes' : 'No'), match: ex ? ex.match || '' : '' }, i);
      first = false;
    });
    rows('Routine Payments').forEach((r, i) => {
      const name = txt(r['Name']); if (!name || /^example/i.test(name) || txt(r['Your decision']).toLowerCase() === 'remove') return;
      const ex = PH.live('routine').find(x => x.name.toLowerCase() === name.toLowerCase() && x.account === txt(r['From account']));
      upsert('routine', 'name', { name, amount: num(r['Amount ($)']), freq: txt(r['Frequency']), next: day(r['Next due date']), account: txt(r['From account']), type: txt(r['Type']) || 'Bill', to: txt(r['To account (transfers only)']), category: txt(r['Category']), active: yes(r['Active']), check: txt(r['Confidence']).toLowerCase() === 'check' ? 'Yes' : 'No', notes: txt(r['Notes']), match: ex ? ex.match || '' : '' }, i);
    });
    rows('Budgets').forEach((r, i) => {
      const c = txt(r['Category']); if (!c || c.toLowerCase() === 'total') return;
      upsert('budgets', 'category', { category: c, amount: num(r['Budget amount ($)']), period: txt(r['Budget period']) || 'Fortnightly', notes: txt(r['Notes']) }, i);
    });
  });
  return `Brought in ${n.accounts} accounts, ${n.income} income, ${n.routine} payments and ${n.budgets} categories.`;
}
function importJSON(j) {
  if (j.app === 'penny-hunter-backup') { const r = PH.merge(j.db); PH.batch(() => PH.setSetting('restored', new Date().toISOString())); return r.localChanged ? 'Backup brought in. Newer changes on this device were kept.' : 'Nothing new in that backup.'; }
  if (j.app !== 'penny-hunter-matching') throw new Error("This isn't a Penny Hunter file.");
  let n = 0;
  PH.batch(() => {
    if (j.own_names) PH.setSetting('own_names', j.own_names.join('\n'));
    if (j.suggest) PH.setSetting('suggest', Object.entries(j.suggest));
    for (const i of PH.live('income')) { const k = Object.keys(j.income || {}).find(k => i.name.toLowerCase().startsWith(k.toLowerCase())); if (k) { PH.put('income', i.id, { match: j.income[k] }); n++; } }
    const keys = Object.keys(j.payments || {}).sort((a, b) => b.length - a.length);
    for (const p of PH.live('routine')) { if (p.match) continue; const k = keys.find(k => p.name.toLowerCase().startsWith(k.toLowerCase())); if (k) { PH.put('routine', p.id, { match: j.payments[k] }); n++; } }
  });
  return `Matching words set for ${n} income and payments, plus your names on statements.`;
}
async function importOldDB(bytes) {
  if (!window.initSqlJs) await loadScript(LIB.sql + 'sql-wasm.js');
  const SQL = await initSqlJs({ locateFile: f => LIB.sql + f });
  const db = new SQL.Database(bytes);
  const all = q => { try { const r = db.exec(q)[0]; return r ? r.values.map(v => Object.fromEntries(r.columns.map((c, i) => [c, v[i]]))) : []; } catch { return []; } };
  const tx = all('select * from tx'); if (!tx.length && !all("select name from sqlite_master where name='tx'").length) throw new Error("This isn't an old Penny Hunter data file.");
  let added = 0;
  PH.batch(() => {
    for (const t of tx) {
      if (PH.DB.tx[t.dedupe_key] && !PH.DB.tx[t.dedupe_key].del) continue;
      PH.put('tx', t.dedupe_key, { key: t.dedupe_key, n: t.id, account: t.account, date: t.date, amount: t.amount, description: t.description, kind: t.kind, category: t.category, note: t.note || '', reviewed: t.reviewed ? 1 : 0, auto_reason: t.auto_reason || '', merchant: t.merchant, imported_at: t.imported_at }); added++;
    }
    for (const r of all('select * from rules')) if (!PH.DB.rules[r.merchant]) PH.put('rules', r.merchant, { merchant: r.merchant, kind: r.kind, category: r.category, always: r.always ? 1 : 0 });
    for (const b of all('select * from balances')) { const id = 'old' + b.id; if (!PH.DB.balances[id]) PH.put('balances', id, { id, account: b.account, date: b.date, amount: b.amount, source: b.source, s: b.id }); }
    for (const c of all('select * from categories')) if (!PH.DB.categories[c.name.toLowerCase()]) PH.put('categories', c.name.toLowerCase(), { name: c.name, added: c.added });
    const ts = all("select value from settings where key='tracking_start'")[0]; if (ts) PH.setSetting('tracking_start', ts.value);
  });
  return `Brought in ${added} transactions, plus your answers, balances and start date.`;
}

function pref(k) { try { return localStorage.getItem('ph_' + k) || ''; } catch { return ''; } }

function addPage(done) {
  const S = PH.setup(), d = PH.dashboard(), accts = S.accounts.filter(a => !/loan/i.test(a.type || '')).map(a => a.name);
  const card = (S.accounts.find(a => /credit/i.test(a.type || '')) || {}).name;

  const budgetCats = d.budgets.map(b => b.category), others = d.categories.filter(c => !budgetCats.includes(c));
  const recent = [...new Set(PH.live('tx').filter(t => t.manual || /^Matched your entry: /.test(t.auto_reason || '')).sort((a, b) => b.date.localeCompare(a.date)).map(t => t.manual ? t.description : t.auto_reason.replace('Matched your entry: ', '')))].slice(0, 40);

  m.innerHTML = `${done ? `<div class="notice ok"><span>${done}</span></div>` : ''}<div class="panel question"><h2>Add a purchase</h2><p class="muted small" style="margin:4px 0 14px">It counts straight away. When the bank's line comes in with a CSV, the two are matched up.</p>
  <div class="form"><label for="pm">Where</label><div><input type="text" id="pm" list="pml" maxlength="60" autocomplete="off" style="width:100%" placeholder="e.g. Coles Maroubra"><datalist id="pml">${recent.map(r => `<option value="${esc(r)}">`).join('')}</datalist></div>
  <label for="pa">Amount ($)</label><input type="text" id="pa" inputmode="decimal" placeholder="0.00" style="max-width:180px">
  <label for="pd">Date</label><input type="date" id="pd" value="${PH.today()}" style="max-width:200px">
  <label for="pw">Paid with</label><select id="pw" style="max-width:260px">${accts.map(a => `<option ${a === acc0 ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select></div>
  <h3 style="margin-top:16px">Budget</h3><div class="chips" id="pc">${budgetCats.map(chip).join('')}<button class="chip" data-c="" aria-pressed="false">Not in a budget</button></div>
  ${others.length ? `<details><summary>Other categories</summary><div class="chips" style="margin-top:8px">${others.map(chip).join('')}</div></details>` : ''}
  <label for="pn" style="display:block;margin-top:12px"><h3>Note (optional)</h3></label><input type="text" id="pn" maxlength="120" style="width:100%;margin-top:6px">
  <p class="muted small" style="margin-top:10px">${pref('who') ? 'Entered by ' + esc(pref('who')) + '.' : 'Add your name in Settings to show who entered it.'}</p>
  <p class="err" id="er" hidden></p><div id="dupe"></div><div class="actions"><button class="btn" id="ps">Save purchase</button><button class="btn quiet" id="px">Cancel</button></div></div>`;
  let picked = false;
  m.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; picked = true; m.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#px').onclick = () => go('dash');
  const er = t => { $('#er').textContent = t; $('#er').hidden = false; };
  const vals = () => ({ merchant: $('#pm').value, amount: $('#pa').value, date: $('#pd').value, account: $('#pw').value, category: cat, note: $('#pn').value, by: pref('who') });
  const finish = (v, how) => {
    setPref('account', v.account);
    const b = PH.dashboard().budgets.find(x => x.category === v.category);
    const amt = Math.abs(parseFloat(String(v.amount).replace(/[$,]/g, '')));
    addPage(`${how} ${esc(v.merchant.trim())}, ${fmt(amt)}${v.category ? ' in ' + esc(v.category) : ''}.${b ? ` ${esc(b.category)} has ${fmt(b.left)} left of ${fmt(b.budget, 0)} this fortnight.` : ''}`);
  };
  const save = async force => {
    $('#er').hidden = true; const v = vals();
    try {
      if (!picked) throw new Error('Choose a budget, or Not in a budget.');
      if (!force) {
        const amt = Math.abs(parseFloat(String(v.amount).replace(/[$,]/g, '')));
        const look = isNaN(amt) || !/^\d{4}-\d\d-\d\d$/.test(v.date) ? [] : PH.bankLookalikes(v.date, amt, v.account);
        if (look.length) {
          const t = look[0];
          $('#dupe').innerHTML = `<div class="cand"><p><b style="font-weight:600">This might already be in your bank files:</b><br>${dt(t.date)}, ${esc(t.description)}, ${fmt(-t.amount)}</p><div class="actions" style="margin-top:10px"><button class="btn" id="usebank">Use that one</button><button class="btn quiet" id="anyway">Add as a new purchase</button></div></div>`;

          $('#anyway').onclick = () => save(true);
          return;
        }
      }
      await api('/api/purchase', v); finish(v, 'Saved');
    } catch (e) { er(e.message); }
  };
  $('#ps').onclick = () => save(false);
  setTimeout(() => $('#pm').focus(), 50);
}
