const CHANGELOG="PENNY HUNTER - VERSION HISTORY\nWorking towards version 1.0.\n\n0.8.3 (13 Nov 2026) - Home loan split, one-off payments, looking further ahead\n- The loan now has two balances under Update: what you owe (used only for your overall position) and what's available to redraw (used for the repayment check).\n- Repayment check is now: available now, plus rent and pay-day transfers due in before the repayment, less the repayment.\n- The repayment is the average of your last three repayments in the loan file, or the Setup amount if there are none yet.\n- Money taken out of the loan after you enter the available figure is taken off.\n- One-off payments: Setup, Payments, Add a one-off payment (or How often: Once) for anything due on a single date, like a bill in six weeks. It comes off on its due date.\n- The dashboard's main figure can now look ahead: Until payday, Next 3 months or Next 12 months.\n- The 3 and 12 month views start from what's left at payday, then add each pay and take off every bill (including quarterly, yearly and one-off ones) and each fortnight's budgets. They show where you'll end up, whether you're up or down over that time, and the lowest point along the way.\n\n0.8.2 (13 Nov 2026) - Home loan check fix\n- Each expected payment into the loan is matched to the loan's own lines within a few days, so a payment posted a day or two away from its scheduled date is still found.\n- If the loan file doesn't show a repayment yet, it's taken from the account it was paid from.\n- Payments near the tracking start date are assumed paid, and any extra money paid in is listed separately.\n\n0.8.1 (13 Nov 2026) - Card purchases no longer taken off twice\n- Left until payday is now: balances, less bills due, less what's left in your budgets (and any entries not yet in a balance).\n- Card purchases count against their budgets only. The credit card section shows this fortnight's purchases for reference.\n- The account check follows the same rule.\n\n0.8.0 (13 Nov 2026) - Enter purchases as you go\n- New + Purchase button (bottom corner on the phone): where, amount, date, what you paid with and which budget.\n- Entries count towards budgets and the main figure straight away, and show who entered them.\n- Importing a CSV matches entries to the bank's lines automatically (same account and amount, within a week). Close matches are offered when you answer questions.\n- If a purchase is already in your bank files, the app offers to use that line instead.\n- Entries not found after a week are flagged, and can be deleted.\n\n0.7.1 (10 Nov 2026) - Phone layout\n- On the phone, budgets come first: spent, budget and left for the fortnight, any categories over budget, then each category.\n- The left-until-payday figure follows, with the rest of the dashboard below. The laptop layout is unchanged.\n\n0.7.0 (10 Nov 2026) - Web app for laptop and phone\n- Penny Hunter now runs in the browser and installs as an app on Windows and Android. No more building.\n- Setup is done in the app instead of an Excel file. Your old setup file can be brought in once.\n- Optional syncing between devices through a private GitHub gist, encrypted with your passphrase.\n- Old Penny Hunter data (transactions, answers and balances) can be brought in.\n- Personal matching words (names, payees) now live in your data, not in the app's code.\n- Download a backup copy at any time.\n\n0.6.1 (10 Nov 2026) - Account check matches the main figure\n- The account check now takes new card purchases and the rest of your budgets out of your pay account.\n- When an account is short, it shows any spare money in your other accounts.\n\n0.6.0 (7 Nov 2026) - Home loan check\n- Shows whether money going into the home loan covers the monthly charge, and how much to add if not.\n- Version numbers and this history.\n\n0.5.2 (7 Nov 2026) - Build fix for OneDrive folders.\n0.5.1 (7 Nov 2026) - Add a category while answering questions; fixed the file-drop box.\n0.5.0 (5 Nov 2026
